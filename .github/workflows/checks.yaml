name: Checks

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.49.0
          cache: true
      - name: Install Python dev dependencies
        run: pixi run -e dev install-dev
      - name: Execute linter
        run: pixi run -e dev lint-check
      - name: Execute formatter
        run: pixi run -e dev format-check

  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            environment: py311
          - python-version: "3.12"
            environment: py312
          - python-version: "3.13"
            environment: py313
          - python-version: "3.14"
            environment: py314
          - python-version: "3.15"
            environment: py315
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.49.0
          cache: true
          environments: ${{ matrix.environment }}
      - name: Install Python dev dependencies
        run: pixi run -e ${{ matrix.environment }} install-dev
      - name: Execute tests
        run: pixi run -e ${{ matrix.environment }} python --version && pixi run -e ${{ matrix.environment }} test

  action:
    name: Setup action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require this version, like the content repository does
        run: echo "ceos-ard-cli~=$(sed -E 's/.*"(.*)".*/\1/' ceos_ard_cli/version.py)" > "$RUNNER_TEMP/requirements.txt"
      - uses: ./
        with:
          requirements-file: ${{ runner.temp }}/requirements.txt
      - name: Run the CLI from the activated environment
        run: ceos-ard validate --help
