name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for PyPI's trusted publishing
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Compare the tag with the version
      run: test "v$(sed -nE 's/^__version__ = "(.*)"$/\1/p' ceos_ard_cli/version.py)" = "$GITHUB_REF_NAME"
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.49.0
        environments: dev
    - name: Install Python dev dependencies
      run: pixi run -e dev install-dev
    - name: Build package
      run: pixi run -e dev build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
